{% extends "base.html" %}

{% block title %}Logs - KIVerdienst v2{% endblock %}

{% block content %}
<div class="logs-page">
    <div class="page-header">
        <h1>System-Logs</h1>
        <p>Echtzeit-Überwachung von Systemereignissen</p>
    </div>

    <!-- Log Filters -->
    <div class="log-filters">
        <div class="filter-group">
            <label for="level-filter">Level:</label>
            <select id="level-filter" onchange="loadLogs()">
                <option value="">Alle</option>
                <option value="DEBUG">Debug</option>
                <option value="INFO">Info</option>
                <option value="WARNING">Warning</option>
                <option value="ERROR">Error</option>
                <option value="CRITICAL">Critical</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="component-filter">Komponente:</label>
            <select id="component-filter" onchange="loadLogs()">
                <option value="">Alle</option>
                {% for component in components %}
                <option value="{{ component }}">{{ component }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="filter-group">
            <label for="limit-filter">Anzahl:</label>
            <select id="limit-filter" onchange="loadLogs()">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
                <option value="500">500</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>
                <input type="checkbox" id="auto-refresh" checked onchange="toggleAutoRefresh()">
                Auto-Aktualisierung (5s)
            </label>
        </div>
        
        <button class="btn btn-secondary" onclick="loadLogs()">
            <span>🔄</span> Aktualisieren
        </button>
        
        <button class="btn btn-secondary" onclick="clearLogsDisplay()">
            <span>🗑️</span> Anzeige leeren
        </button>
    </div>

    <!-- Log Statistics -->
    <div class="log-stats">
        <div class="stat-item">
            <span class="stat-label">Gesamt:</span>
            <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-item stat-debug">
            <span class="stat-label">Debug:</span>
            <span class="stat-value" id="stat-debug">0</span>
        </div>
        <div class="stat-item stat-info">
            <span class="stat-label">Info:</span>
            <span class="stat-value" id="stat-info">0</span>
        </div>
        <div class="stat-item stat-warning">
            <span class="stat-label">Warning:</span>
            <span class="stat-value" id="stat-warning">0</span>
        </div>
        <div class="stat-item stat-error">
            <span class="stat-label">Error:</span>
            <span class="stat-value" id="stat-error">0</span>
        </div>
    </div>

    <!-- Logs Display -->
    <div class="logs-container">
        <div id="logs-list" class="logs-list">
            <div class="loading">Lädt Logs...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let autoRefreshInterval = null;
    let currentLogs = [];

    async function loadLogs() {
        const level = document.getElementById('level-filter').value;
        const component = document.getElementById('component-filter').value;
        const limit = document.getElementById('limit-filter').value;
        
        let url = `/api/debug/logs?limit=${limit}`;
        if (level) url += `&level=${level}`;
        if (component) url += `&component=${component}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.logs) {
                currentLogs = data.logs;
                displayLogs(data.logs);
                updateStats(data.logs);
            }
        } catch (error) {
            console.error('Error loading logs:', error);
            showToast('Fehler beim Laden der Logs', 'error');
        }
    }

    function displayLogs(logs) {
        const logsList = document.getElementById('logs-list');
        
        if (logs.length === 0) {
            logsList.innerHTML = '<div class="empty-logs">Keine Logs vorhanden</div>';
            return;
        }
        
        logsList.innerHTML = logs.map(log => {
            const levelClass = log.level.toLowerCase();
            const details = log.details ? JSON.stringify(log.details, null, 2) : '';
            
            return `
                <div class="log-entry log-${levelClass}">
                    <div class="log-header">
                        <span class="badge badge-${getLevelBadgeClass(log.level)}">${log.level}</span>
                        <span class="log-component">${log.component || 'system'}</span>
                        <span class="log-time">${formatDateTime(log.created_at)}</span>
                    </div>
                    <div class="log-message">${escapeHtml(log.message)}</div>
                    ${details ? `<details class="log-details"><summary>Details</summary><pre>${escapeHtml(details)}</pre></details>` : ''}
                </div>
            `;
        }).join('');
    }

    function updateStats(logs) {
        const stats = {
            total: logs.length,
            debug: 0,
            info: 0,
            warning: 0,
            error: 0
        };
        
        logs.forEach(log => {
            const level = log.level.toLowerCase();
            if (stats.hasOwnProperty(level)) {
                stats[level]++;
            }
        });
        
        document.getElementById('stat-total').textContent = stats.total;
        document.getElementById('stat-debug').textContent = stats.debug;
        document.getElementById('stat-info').textContent = stats.info;
        document.getElementById('stat-warning').textContent = stats.warning;
        document.getElementById('stat-error').textContent = stats.error;
    }

    function getLevelBadgeClass(level) {
        const classes = {
            'DEBUG': 'secondary',
            'INFO': 'info',
            'WARNING': 'warning',
            'ERROR': 'error',
            'CRITICAL': 'error'
        };
        return classes[level] || 'secondary';
    }

    function formatDateTime(dateString) {
        const date = new Date(dateString);
        return date.toLocaleString('de-DE', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function toggleAutoRefresh() {
        const checkbox = document.getElementById('auto-refresh');
        
        if (checkbox.checked) {
            startAutoRefresh();
        } else {
            stopAutoRefresh();
        }
    }

    function startAutoRefresh() {
        if (autoRefreshInterval) return;
        
        autoRefreshInterval = setInterval(() => {
            loadLogs();
        }, 5000); // Refresh every 5 seconds
    }

    function stopAutoRefresh() {
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }
    }

    function clearLogsDisplay() {
        document.getElementById('logs-list').innerHTML = '<div class="empty-logs">Logs geleert</div>';
        updateStats([]);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadLogs();
        startAutoRefresh();
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
        stopAutoRefresh();
    });
</script>
{% endblock %}
