{% extends "base.html" %}

{% block title %}Videos - KIVerdienst v2{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Video Library</h1>
    <button class="btn btn-primary" onclick="showCreateVideoModal()">+ Create Video</button>
</div>

<div class="filter-bar">
    <select id="brandFilter" class="form-control" onchange="filterVideos()">
        <option value="">All Brands</option>
    </select>
    <select id="statusFilter" class="form-control" onchange="filterVideos()">
        <option value="">All Status</option>
        <option value="draft">Draft</option>
        <option value="ready">Ready</option>
        <option value="posted">Posted</option>
    </select>
</div>

<div class="videos-container">
    <div id="videosList" class="videos-grid">
        <p class="loading">Loading videos...</p>
    </div>
</div>

<!-- Create/Edit Video Modal -->
<div id="videoModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2 id="modalTitle">Create Video</h2>
            <button class="modal-close" onclick="closeVideoModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="videoForm" onsubmit="saveVideo(event)">
                <input type="hidden" id="videoId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="videoBrand">Brand *</label>
                        <select id="videoBrand" class="form-control" required onchange="loadCharactersForBrand()">
                            <option value="">Select brand...</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="videoCharacter">Character</label>
                        <select id="videoCharacter" class="form-control">
                            <option value="">Select character...</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="videoTitle">Title *</label>
                    <input type="text" id="videoTitle" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="videoScript">Script</label>
                    <textarea id="videoScript" class="form-control" rows="8" placeholder="Video script..."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="videoStatus">Status</label>
                        <select id="videoStatus" class="form-control">
                            <option value="draft">Draft</option>
                            <option value="ready">Ready</option>
                            <option value="posted">Posted</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="videoPlatform">Platform</label>
                        <select id="videoPlatform" class="form-control">
                            <option value="tiktok">TikTok</option>
                            <option value="instagram">Instagram</option>
                            <option value="youtube">YouTube Shorts</option>
                        </select>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeVideoModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Video</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentVideoId = null;
let allVideos = [];
let allBrands = [];
let allCharacters = [];

async function loadBrands() {
    try {
        const response = await apiRequest('/brands');
        
        if (response.success) {
            allBrands = response.data;
            
            const brandSelects = ['videoBrand', 'brandFilter'];
            brandSelects.forEach(selectId => {
                const select = document.getElementById(selectId);
                const options = allBrands.map(brand => 
                    `<option value="${brand.id}">${brand.name}</option>`
                ).join('');
                
                if (selectId === 'brandFilter') {
                    select.innerHTML = '<option value="">All Brands</option>' + options;
                } else {
                    select.innerHTML = '<option value="">Select brand...</option>' + options;
                }
            });
        }
    } catch (error) {
        console.error('Error loading brands:', error);
    }
}

async function loadCharacters() {
    try {
        const response = await apiRequest('/characters');
        if (response.success) {
            allCharacters = response.data;
        }
    } catch (error) {
        console.error('Error loading characters:', error);
    }
}

function loadCharactersForBrand() {
    const brandId = document.getElementById('videoBrand').value;
    const characterSelect = document.getElementById('videoCharacter');
    
    if (!brandId) {
        characterSelect.innerHTML = '<option value="">Select character...</option>';
        return;
    }
    
    const brandCharacters = allCharacters.filter(c => c.brand_id == brandId);
    const options = brandCharacters.map(character => 
        `<option value="${character.id}">${character.name}</option>`
    ).join('');
    
    characterSelect.innerHTML = '<option value="">Select character...</option>' + options;
}

async function loadVideos() {
    try {
        const response = await apiRequest('/videos');
        
        if (response.success) {
            allVideos = response.data;
            filterVideos();
        }
    } catch (error) {
        console.error('Error loading videos:', error);
        showNotification('Error loading videos', 'error');
    }
}

function filterVideos() {
    const brandId = document.getElementById('brandFilter').value;
    const status = document.getElementById('statusFilter').value;
    
    let filtered = allVideos;
    
    if (brandId) {
        filtered = filtered.filter(v => v.brand_id == brandId);
    }
    
    if (status) {
        filtered = filtered.filter(v => v.status === status);
    }
    
    const videosDiv = document.getElementById('videosList');
    
    if (filtered.length === 0) {
        videosDiv.innerHTML = '<p class="empty-state">No videos found. Create your first video!</p>';
    } else {
        videosDiv.innerHTML = filtered.map(video => `
            <div class="video-card">
                <div class="video-thumbnail">
                    🎬
                </div>
                <div class="video-info">
                    <h3>${video.title}</h3>
                    <p class="video-brand">${video.brand_name || 'Unknown Brand'}</p>
                    <p class="video-character">${video.character_name ? '👤 ' + video.character_name : 'No character'}</p>
                    <div class="video-meta">
                        <span class="badge ${video.status === 'posted' ? 'badge-success' : 'badge-warning'}">${video.status}</span>
                        <span>${video.platform || 'tiktok'}</span>
                    </div>
                    <div class="video-stats">
                        <span>👁️ ${formatNumber(video.views || 0)}</span>
                        <span>❤️ ${formatNumber(video.likes || 0)}</span>
                    </div>
                </div>
                <div class="video-actions">
                    <button class="btn btn-sm btn-secondary" onclick="editVideo(${video.id})">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteVideo(${video.id}, '${video.title}')">Delete</button>
                </div>
            </div>
        `).join('');
    }
}

function showCreateVideoModal() {
    currentVideoId = null;
    document.getElementById('modalTitle').textContent = 'Create Video';
    document.getElementById('videoForm').reset();
    document.getElementById('videoId').value = '';
    document.getElementById('videoModal').style.display = 'flex';
}

async function editVideo(id) {
    try {
        const response = await apiRequest(`/videos/${id}`);
        
        if (response.success) {
            const video = response.data;
            currentVideoId = id;
            
            document.getElementById('modalTitle').textContent = 'Edit Video';
            document.getElementById('videoId').value = id;
            document.getElementById('videoBrand').value = video.brand_id;
            loadCharactersForBrand();
            document.getElementById('videoCharacter').value = video.character_id || '';
            document.getElementById('videoTitle').value = video.title;
            document.getElementById('videoScript').value = video.script || '';
            document.getElementById('videoStatus').value = video.status;
            document.getElementById('videoPlatform').value = video.platform || 'tiktok';
            document.getElementById('videoModal').style.display = 'flex';
        }
    } catch (error) {
        console.error('Error loading video:', error);
        showNotification('Error loading video', 'error');
    }
}

async function saveVideo(event) {
    event.preventDefault();
    
    const characterId = document.getElementById('videoCharacter').value;
    
    const videoData = {
        brand_id: parseInt(document.getElementById('videoBrand').value),
        character_id: characterId ? parseInt(characterId) : null,
        title: document.getElementById('videoTitle').value,
        script: document.getElementById('videoScript').value,
        status: document.getElementById('videoStatus').value,
        platform: document.getElementById('videoPlatform').value
    };
    
    try {
        const videoId = document.getElementById('videoId').value;
        const method = videoId ? 'PUT' : 'POST';
        const endpoint = videoId ? `/videos/${videoId}` : '/videos';
        
        const response = await apiRequest(endpoint, method, videoData);
        
        if (response.success) {
            showNotification(`Video ${videoId ? 'updated' : 'created'} successfully`, 'success');
            closeVideoModal();
            loadVideos();
        } else {
            showNotification(response.error || 'Error saving video', 'error');
        }
    } catch (error) {
        console.error('Error saving video:', error);
        showNotification('Error saving video', 'error');
    }
}

async function deleteVideo(id, title) {
    if (!confirm(`Are you sure you want to delete "${title}"?`)) {
        return;
    }
    
    try {
        const response = await apiRequest(`/videos/${id}`, 'DELETE');
        
        if (response.success) {
            showNotification('Video deleted successfully', 'success');
            loadVideos();
        } else {
            showNotification(response.error || 'Error deleting video', 'error');
        }
    } catch (error) {
        console.error('Error deleting video:', error);
        showNotification('Error deleting video', 'error');
    }
}

function closeVideoModal() {
    document.getElementById('videoModal').style.display = 'none';
    document.getElementById('videoForm').reset();
    currentVideoId = null;
}

function formatNumber(num) {
    if (num >= 1000000) {
        return (num / 1000000).toFixed(1) + 'M';
    } else if (num >= 1000) {
        return (num / 1000).toFixed(1) + 'K';
    }
    return num.toString();
}

// Load data on page load
loadBrands();
loadCharacters();
loadVideos();
</script>
{% endblock %}
