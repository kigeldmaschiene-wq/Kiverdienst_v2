version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiverdienst_v2_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiverdienst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure123kiverdienst}
      POSTGRES_DB: ${POSTGRES_DB:-kiverdienst_v2}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kiverdienst_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiverdienst}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiverdienst_v2_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kiverdienst}:${POSTGRES_PASSWORD:-secure123kiverdienst}@postgres:5432/${POSTGRES_DB:-kiverdienst_v2}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kiverdienst_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiverdienst_v2_frontend
    environment:
      BACKEND_URL: http://backend:8000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      FRONTEND_PORT: ${FRONTEND_PORT:-5000}
      DEBUG: ${DEBUG:-false}
    ports:
      - "5000:5000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - kiverdienst_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  kiverdienst_network:
    driver: bridge
